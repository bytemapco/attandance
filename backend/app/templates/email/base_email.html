<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="supported-color-schemes" content="light dark" />
  <title>{{ subject }}</title>
  <style type="text/css">
    .preheader { display:none !important; visibility:hidden; opacity:0; color:transparent; height:0; width:0; overflow:hidden; mso-hide:all; }
    a { text-decoration:none; }
    @media screen and (max-width: 620px) {
      .email-outer { padding:20px 12px !important; }
      .email-header, .email-content, .email-footer { padding-left:22px !important; padding-right:22px !important; }
    }
    @media (prefers-color-scheme: dark) {
      body, .email-canvas { background-color:#171f22 !important; }
      .email-card { background-color:#222d32 !important; border-color:#3d4b50 !important; }
      .email-header { background-color:#ffffff !important; border-bottom-color:#3d4b50 !important; }
      .email-footer { background-color:#171f22 !important; border-top-color:#3d4b50 !important; }
      .text-title { color:#f2f0ea !important; }
      .text-body { color:#c0c9c8 !important; }
      .text-muted { color:#c0c9c8 !important; }
      .info-table { border-color:#3d4b50 !important; background-color:#222d32 !important; }
      .info-header-cell { background-color:#2a373d !important; border-color:#3d4b50 !important; color:#c0c9c8 !important; }
      .info-value-cell { background-color:#222d32 !important; border-color:#3d4b50 !important; color:#f2f0ea !important; }
      .fallback-box { background-color:#2a373d !important; border-color:#3d4b50 !important; color:#c0c9c8 !important; }
      .secondary-link { color:#d99575 !important; }
    }
  </style>
</head>
<body style="margin:0; padding:0; background-color:#f5f2ed; font-family:'Plus Jakarta Sans', Arial, Helvetica, sans-serif; color:#202b30; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">
  <div class="preheader">{% block preheader %}A message about your SAHAJ account.{% endblock %}</div>
  <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" class="email-canvas">
    <tr>
      <td align="center" class="email-outer" style="padding:36px 16px; background-color:#f5f2ed;">
        <!--[if mso]><table role="presentation" align="center" border="0" cellpadding="0" cellspacing="0" width="600"><tr><td><![endif]-->
        <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" class="email-card" style="max-width:600px; background-color:#ffffff; border:1px solid #e3e1dc; border-radius:14px; border-collapse:separate; overflow:hidden;">
          <tr><td style="height:3px; background-color:#c98260; line-height:3px; font-size:3px;">&nbsp;</td></tr>
          <tr>
            <td class="email-header" style="padding:26px 36px 22px; background-color:#ffffff; border-bottom:1px solid #e3e1dc;">
              <table role="presentation" border="0" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="vertical-align:middle; padding-right:14px;">
                    <img src="{{ logo_url }}" width="132" alt="SAHAJ" style="display:block; width:132px; max-width:100%; height:auto; border:0; outline:none; text-decoration:none;" />
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr><td class="email-content text-body" style="padding:32px 36px; font-size:15px; line-height:1.65; color:#202b30;">{% block content %}{% endblock %}</td></tr>
          <tr>
            <td class="email-footer" style="padding:21px 36px 24px; background-color:#f5f2ed; border-top:1px solid #e3e1dc;">
              <p class="text-title" style="margin:0 0 5px; color:#28363b; font-size:12px; font-weight:700;">SAHAJ</p>
              <p class="text-muted" style="margin:0; color:#526f78; font-size:12px; line-height:1.6;">This message is about your SAHAJ account. If you need help, contact your institution.</p>
            </td>
          </tr>
        </table>
        <!--[if mso]></td></tr></table><![endif]-->
      </td>
    </tr>
  </table>
</body>
</html>
