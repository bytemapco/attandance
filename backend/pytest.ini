[pytest]
minversion = 9.0
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra -q --strict-markers
markers =
    unit: marks unit tests
    integration: marks integration tests
filterwarnings =
    ignore::DeprecationWarning
