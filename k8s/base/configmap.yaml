apiVersion: v1
kind: ConfigMap
metadata:
  name: attendance-config
  labels:
    app.kubernetes.io/part-of: smart-attendance
data:
  ENVIRONMENT: "production"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  PROJECT_NAME: "Smart Attendance System API"
  API_V1_STR: "/api/v1"
  FRONTEND_URL: "http://localhost:3011"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_TLS: "true"
  SMTP_SSL: "false"
  EMAILS_FROM_NAME: "Smart Attendance System"
  AI_DEVICE: "auto"
  AI_FORCE_CPU_FALLBACK: "true"
