
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build:
    name: Build and push Docker images
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Define image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          REPO="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          SHA="${{ github.event.workflow_run.head_sha }}"

          echo "backend_image=ghcr.io/${REPO}-backend:${SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${REPO}-frontend:${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.backend_image }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.frontend_image }}

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: 100.101.187.9

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Validate deployment configuration
        shell: bash
        env:
          BACKEND_ENV: ${{ secrets.PRODUCTION_BACKEND_ENV }}
          FRONTEND_ENV: ${{ secrets.PRODUCTION_FRONTEND_ENV }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail

          test -n "$BACKEND_ENV" || {
            echo "Missing PRODUCTION_BACKEND_ENV"
            exit 1
          }

          test -n "$FRONTEND_ENV" || {
            echo "Missing PRODUCTION_FRONTEND_ENV"
            exit 1
          }

          test -n "$GHCR_READ_TOKEN" || {
            echo "Missing GHCR_READ_TOKEN"
            exit 1
          }

          test -f docker-compose.yml || {
            echo "Expected docker-compose.yml at repository root"
            exit 1
          }

      - name: Upload Compose configuration
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST || '100.101.187.9' }}
          VPS_USER: ${{ vars.VPS_USER || 'jarvis' }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/smart-attendance' }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
        run: |
          set -euo pipefail

          ssh -i "$HOME/.ssh/deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$VPS_DEPLOY_PATH/backend' '$VPS_DEPLOY_PATH/frontend'"

          scp -i "$HOME/.ssh/deploy_key" \
            -P "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            docker-compose.yml \
            "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/docker-compose.yml"

      - name: Update backend environment
        shell: bash
        env:
          BACKEND_ENV: ${{ secrets.PRODUCTION_BACKEND_ENV }}
          VPS_HOST: ${{ vars.VPS_HOST || '100.101.187.9' }}
          VPS_USER: ${{ vars.VPS_USER || 'jarvis' }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/smart-attendance' }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
        run: |
          set -euo pipefail

          printf '%s' "$BACKEND_ENV" |
            ssh -i "$HOME/.ssh/deploy_key" \
              -p "$SSH_PORT" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              "$VPS_USER@$VPS_HOST" \
              "umask 077; cat > '$VPS_DEPLOY_PATH/backend/.env'"

      - name: Update frontend environment
        shell: bash
        env:
          FRONTEND_ENV: ${{ secrets.PRODUCTION_FRONTEND_ENV }}
          VPS_HOST: ${{ vars.VPS_HOST || '100.101.187.9' }}
          VPS_USER: ${{ vars.VPS_USER || 'jarvis' }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/smart-attendance' }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
        run: |
          set -euo pipefail

          printf '%s' "$FRONTEND_ENV" |
            ssh -i "$HOME/.ssh/deploy_key" \
              -p "$SSH_PORT" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              "$VPS_USER@$VPS_HOST" \
              "umask 077; cat > '$VPS_DEPLOY_PATH/frontend/.env'"

      - name: Log in to GHCR on VPS
        shell: bash
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.actor }}
          VPS_HOST: ${{ vars.VPS_HOST || '100.101.187.9' }}
          VPS_USER: ${{ vars.VPS_USER || 'jarvis' }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_READ_TOKEN" |
            ssh -i "$HOME/.ssh/deploy_key" \
              -p "$SSH_PORT" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              "$VPS_USER@$VPS_HOST" \
              "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Deploy with Docker Compose
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST || '100.101.187.9' }}
          VPS_USER: ${{ vars.VPS_USER || 'jarvis' }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/smart-attendance' }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          BACKEND_IMAGE: ${{ needs.build.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build.outputs.frontend_image }}
        run: |
          set -euo pipefail

          ssh -i "$HOME/.ssh/deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_DEPLOY_PATH' &&
             BACKEND_IMAGE='$BACKEND_IMAGE' \
             FRONTEND_IMAGE='$FRONTEND_IMAGE' \
             docker compose config -q &&
             BACKEND_IMAGE='$BACKEND_IMAGE' \
             FRONTEND_IMAGE='$FRONTEND_IMAGE' \
             docker compose pull &&
             BACKEND_IMAGE='$BACKEND_IMAGE' \
             FRONTEND_IMAGE='$FRONTEND_IMAGE' \
             docker compose up -d --remove-orphans"

      - name: Remove temporary local files
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/deploy_key"
          rm -f "$HOME/.ssh/known_hosts"
