name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy via PM2
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Resolve Target Commit SHA
        id: meta
        run: |
          TARGET_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "commit_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.commit_sha }}

      - name: Set up Node.js for Frontend Build
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Standalone
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_PUBLIC_WS_URL: /ws/connect
        run: |
          npm ci
          npm run build
          mkdir -p .next/standalone/frontend/.next
          cp -r public .next/standalone/frontend/public
          cp -r .next/static .next/standalone/frontend/.next/static
          tar -czf ../frontend-bundle.tar.gz -C .next/standalone/frontend .

      - name: Package Backend Bundle
        run: |
          tar -czf backend-bundle.tar.gz --exclude='__pycache__' --exclude='*.pyc' -C backend app prisma requirements.txt

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy to jarvis via PM2
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST || '100.101.187.9' }}
          VPS_USER: ${{ vars.VPS_USER || 'jarvis' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

          # Ensure deployment directories exist
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "mkdir -p /home/jarvis/SharedDrive/bytemap/attandace/backend /home/jarvis/SharedDrive/bytemap/attandace/frontend"

          # Transfer deployment bundles and PM2 configuration
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            frontend-bundle.tar.gz backend-bundle.tar.gz ecosystem.config.js \
            "$VPS_USER@$VPS_HOST:/home/jarvis/SharedDrive/bytemap/attandace/"

          # Deploy bundles and orchestrate with PM2
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail
             export PATH=\"/home/jarvis/.local/bin:/home/linuxbrew/.linuxbrew/bin:\$PATH\"
             cd /home/jarvis/SharedDrive/bytemap/attandace

             # Unpack frontend bundle
             tar -xzf frontend-bundle.tar.gz -C frontend/
             rm -f frontend-bundle.tar.gz

             # Unpack backend bundle
             tar -xzf backend-bundle.tar.gz -C backend/
             rm -f backend-bundle.tar.gz

             # Symlink production .env to both backend and frontend roots
             ln -sf /home/jarvis/SharedDrive/bytemap/attandace/.env /home/jarvis/SharedDrive/bytemap/attandace/backend/.env
             ln -sf /home/jarvis/SharedDrive/bytemap/attandace/.env /home/jarvis/SharedDrive/bytemap/attandace/frontend/.env

             # Setup or update backend virtualenv
             if [ ! -d backend/venv ]; then
               /usr/bin/python3.11 -m venv backend/venv
             fi
             backend/venv/bin/pip install --upgrade pip
             backend/venv/bin/pip install -r backend/requirements.txt
             (cd backend && ./venv/bin/python -m prisma generate)

             # Start or reload services via PM2
             pm2 startOrReload ecosystem.config.js --update-env
             pm2 save

             # Verify services are responding
             echo 'Verifying service health...'
             sleep 5
             curl -fsS http://127.0.0.1:8011/health || { echo 'Backend health check failed'; pm2 logs smart-attendance-backend --lines 20 --nostream; exit 1; }
             curl -fsS -I http://127.0.0.1:3011/ || { echo 'Frontend health check failed'; pm2 logs smart-attendance-frontend --lines 20 --nostream; exit 1; }
             pm2 list"

          rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
