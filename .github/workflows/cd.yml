name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, Publish & Deploy
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Resolve Target Commit SHA
        id: meta
        run: |
          TARGET_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          OWNER_REPO="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "commit_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "owner_repo=$OWNER_REPO" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.commit_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_repo }}-backend:${{ steps.meta.outputs.commit_sha }}
            ghcr.io/${{ steps.meta.outputs.owner_repo }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            NEXT_PUBLIC_WS_URL=/ws/connect
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_repo }}-frontend:${{ steps.meta.outputs.commit_sha }}
            ghcr.io/${{ steps.meta.outputs.owner_repo }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy to jarvis via Docker Compose
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST || '100.101.187.9' }}
          VPS_USER: ${{ vars.VPS_USER || 'jarvis' }}
          BACKEND_IMAGE: ghcr.io/${{ steps.meta.outputs.owner_repo }}-backend:${{ steps.meta.outputs.commit_sha }}
          FRONTEND_IMAGE: ghcr.io/${{ steps.meta.outputs.owner_repo }}-frontend:${{ steps.meta.outputs.commit_sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

          # Ensure project directory exists on jarvis
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "mkdir -p /home/jarvis/SharedDrive/bytemap/attandace"

          # Copy production docker-compose.yml to jarvis
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes docker-compose.yml "$VPS_USER@$VPS_HOST:/home/jarvis/SharedDrive/bytemap/attandace/docker-compose.yml"

          # Deploy and verify live container health
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail
             cd /home/jarvis/SharedDrive/bytemap/attandace

             echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin
             export BACKEND_IMAGE='$BACKEND_IMAGE'
             export FRONTEND_IMAGE='$FRONTEND_IMAGE'

             docker compose pull
             docker compose up -d --remove-orphans
             docker logout ghcr.io || true

             echo 'Verifying deployment health...'
             HEALTHY=false
             for i in {1..24}; do
               if curl -fsS http://127.0.0.1:8011/health > /dev/null 2>&1 && \
                  curl -fsS http://127.0.0.1:3011/ > /dev/null 2>&1; then
                 HEALTHY=true
                 echo "Application passed all health checks on iteration $i."
                 break
               fi
               echo "Waiting for containers to become ready... (attempt $i/24)"
               sleep 5
             done

             if [ \"\$HEALTHY\" != 'true' ]; then
               echo 'Deployment verification FAILED. Recent container logs:'
               docker compose logs --tail=50
               exit 1
             fi

             docker compose ps"

          rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
