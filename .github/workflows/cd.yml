name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, Publish & Deploy
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repository name for GHCR
        id: repo
        run: |
          echo "owner_repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner_repo }}-backend:${{ steps.repo.outputs.commit_sha }}
            ghcr.io/${{ steps.repo.outputs.owner_repo }}-backend:latest

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            NEXT_PUBLIC_WS_URL=/ws/connect
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner_repo }}-frontend:${{ steps.repo.outputs.commit_sha }}
            ghcr.io/${{ steps.repo.outputs.owner_repo }}-frontend:latest

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy to k3s on jarvis
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST || '100.101.187.9' }}
          VPS_USER: ${{ vars.VPS_USER || 'jarvis' }}
          BACKEND_IMAGE: ghcr.io/${{ steps.repo.outputs.owner_repo }}-backend:${{ steps.repo.outputs.commit_sha }}
          FRONTEND_IMAGE: ghcr.io/${{ steps.repo.outputs.owner_repo }}-frontend:${{ steps.repo.outputs.commit_sha }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

          # Copy k8s manifests to the project deployment directory on jarvis
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "mkdir -p /home/jarvis/SharedDrive/bytemap/attandace/k8s/base /home/jarvis/SharedDrive/bytemap/attandace/k8s/overlays/production"

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -r k8s/base/* "$VPS_USER@$VPS_HOST:/home/jarvis/SharedDrive/bytemap/attandace/k8s/base/"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -r k8s/overlays/* "$VPS_USER@$VPS_HOST:/home/jarvis/SharedDrive/bytemap/attandace/k8s/overlays/"

          # Update image tags with commit SHA and apply manifests on k3s
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail
             cd /home/jarvis/SharedDrive/bytemap/attandace/k8s/overlays/production
             /usr/local/bin/k3s kubectl apply -k .
             /usr/local/bin/k3s kubectl -n attendance set image deployment/backend backend='$BACKEND_IMAGE'
             /usr/local/bin/k3s kubectl -n attendance set image deployment/frontend frontend='$FRONTEND_IMAGE'
             /usr/local/bin/k3s kubectl -n attendance rollout status deployment/backend --timeout=180s
             /usr/local/bin/k3s kubectl -n attendance rollout status deployment/frontend --timeout=180s"

          rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
