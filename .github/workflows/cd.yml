name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy via PM2
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Resolve Target Commit SHA
        id: meta
        run: |
          TARGET_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "commit_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.commit_sha }}

      - name: Set up Node.js for Frontend Build
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Standalone
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://attandace_backend.bytemap.in/api/v1
          NEXT_PUBLIC_WS_URL: wss://attandace_backend.bytemap.in/ws/connect
          NEXT_PUBLIC_DEFAULT_TENANT_ID: default-institution
        run: |
          npm ci
          npm run build
          mkdir -p .next/standalone/frontend/.next
          cp -r public .next/standalone/frontend/public
          cp -r .next/static .next/standalone/frontend/.next/static
          tar -czf ../frontend-bundle.tar.gz -C .next/standalone/frontend .

      - name: Package Backend Bundle
        run: |
          tar -czf backend-bundle.tar.gz --exclude='__pycache__' --exclude='*.pyc' -C backend app models prisma scripts main.py requirements.txt

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy to jarvis via PM2
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST || '100.101.187.9' }}
          VPS_USER: ${{ vars.VPS_USER || 'jarvis' }}
          PRODUCTION_BACKEND_ENV: ${{ secrets.PRODUCTION_BACKEND_ENV }}
          PRODUCTION_FRONTEND_ENV: ${{ secrets.PRODUCTION_FRONTEND_ENV }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

          # Prepare environment files locally for secure transfer
          mkdir -p /tmp/deploy_envs
          chmod 700 /tmp/deploy_envs
          printf '%s\n' "$PRODUCTION_BACKEND_ENV" > /tmp/deploy_envs/backend.env
          printf '%s\n' "$PRODUCTION_FRONTEND_ENV" > /tmp/deploy_envs/frontend.env
          chmod 600 /tmp/deploy_envs/backend.env /tmp/deploy_envs/frontend.env

          # Ensure deployment directories exist
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "mkdir -p /home/jarvis/SharedDrive/bytemap/attandace/backend /home/jarvis/SharedDrive/bytemap/attandace/frontend"

          # Securely transfer environment files
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            /tmp/deploy_envs/backend.env "$VPS_USER@$VPS_HOST:/home/jarvis/SharedDrive/bytemap/attandace/backend/.env"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            /tmp/deploy_envs/frontend.env "$VPS_USER@$VPS_HOST:/home/jarvis/SharedDrive/bytemap/attandace/frontend/.env"
          rm -rf /tmp/deploy_envs

          # Transfer deployment bundles and PM2 configuration
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            frontend-bundle.tar.gz backend-bundle.tar.gz ecosystem.config.cjs \
            "$VPS_USER@$VPS_HOST:/home/jarvis/SharedDrive/bytemap/attandace/"

          # Deploy bundles and orchestrate with PM2
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail
             export PATH=\"/home/jarvis/SharedDrive/bytemap/attandace/backend/venv/bin:/home/jarvis/.local/bin:/home/linuxbrew/.linuxbrew/bin:\$PATH\"
             cd /home/jarvis/SharedDrive/bytemap/attandace

             # Set strict permissions on environment files
             chmod 600 backend/.env frontend/.env

             # Unpack frontend bundle
             tar -xzf frontend-bundle.tar.gz -C frontend/
             rm -f frontend-bundle.tar.gz

             # Unpack backend bundle
             tar -xzf backend-bundle.tar.gz -C backend/
             rm -f backend-bundle.tar.gz

             # Setup or update backend virtualenv
             if [ ! -d backend/venv ]; then
               /usr/bin/python3.11 -m venv backend/venv
             fi
             pip install --upgrade pip
             pip install -r backend/requirements.txt
             (cd backend && prisma generate && prisma db push --accept-data-loss)

             # Ensure local redis-server is active if installed
             if command -v redis-server >/dev/null 2>&1; then
               if ! pgrep -x redis-server >/dev/null 2>&1; then
                 echo 'Starting local redis-server in daemon mode...'
                 redis-server --daemonize yes || true
               fi
             fi

             # Start or reload services via PM2
             pm2 startOrReload ecosystem.config.cjs --update-env
             pm2 save

             # Verify services are responding with retry tolerance for model loading
             echo 'Waiting for services initialization...'
             curl --retry 15 --retry-delay 3 --retry-connrefused -fsS http://127.0.0.1:8011/health || { echo 'Backend health check failed'; pm2 logs smart-attendance-backend --lines 40 --nostream; exit 1; }
             curl --retry 8 --retry-delay 2 --retry-connrefused -fsS -I http://127.0.0.1:3011/ || { echo 'Frontend health check failed'; pm2 logs smart-attendance-frontend --lines 40 --nostream; exit 1; }
             pm2 list"

          rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
