name: CD Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-connectivity:
    name: Test VPS Connectivity
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Verify SSH connectivity to jarvis
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          VPS_HOST: "100.101.187.9"
          VPS_USER: "jarvis"
        run: |
          set -euo pipefail

          if [ -z "$SSH_KEY" ]; then
            echo "::error::SSH_PRIVATE_KEY secret is not set or empty."
            exit 1
          fi

          if [ -z "$SSH_HOSTS" ]; then
            echo "::error::SSH_KNOWN_HOSTS secret is not set or empty."
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          # Write key and known hosts safely without echoing secrets to stdout
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/test_deploy_key"
          printf '%s\n' "$SSH_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/test_deploy_key" "$HOME/.ssh/known_hosts"

          echo "Attempting SSH connection to $VPS_USER@$VPS_HOST over Tailnet..."

          REMOTE_HOSTNAME=$(ssh -i "$HOME/.ssh/test_deploy_key" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" "hostname")

          REMOTE_USER=$(ssh -i "$HOME/.ssh/test_deploy_key" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" "whoami")

          # Cleanup private key immediately
          rm -f "$HOME/.ssh/test_deploy_key"

          echo "========================================="
          echo "SUCCESS: Connected to VPS via Tailscale!"
          echo "Remote Hostname: $REMOTE_HOSTNAME"
          echo "Remote User:     $REMOTE_USER"
          echo "========================================="
