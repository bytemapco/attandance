name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-check:
    name: Frontend Quality Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Run Vitest unit tests
        run: npm test

      - name: Build Next.js application
        env:
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_PUBLIC_WS_URL: /ws/connect
        run: npm run build

  backend-check:
    name: Backend Quality Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies for OpenCV and GLib
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Generate Prisma Client Python
        run: python -m prisma generate

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Pytest test suite
        run: pytest tests/ -v

  compose-validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose File Syntax
        run: docker compose config --quiet

  deploy:
    name: Build, Publish & Deploy
    needs: [frontend-check, backend-check, compose-validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    concurrency:
      group: production-deploy
      cancel-in-progress: false

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repository name for GHCR
        id: repo
        run: |
          echo "owner_repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner_repo }}-backend:${{ steps.repo.outputs.commit_sha }}
            ghcr.io/${{ steps.repo.outputs.owner_repo }}-backend:latest

      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            NEXT_PUBLIC_WS_URL=/ws/connect
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner_repo }}-frontend:${{ steps.repo.outputs.commit_sha }}
            ghcr.io/${{ steps.repo.outputs.owner_repo }}-frontend:latest

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy via Docker Compose on jarvis
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST || '100.101.187.9' }}
          VPS_USER: ${{ vars.VPS_USER || 'jarvis' }}
          BACKEND_IMAGE: ghcr.io/${{ steps.repo.outputs.owner_repo }}-backend:${{ steps.repo.outputs.commit_sha }}
          FRONTEND_IMAGE: ghcr.io/${{ steps.repo.outputs.owner_repo }}-frontend:${{ steps.repo.outputs.commit_sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

          # Ensure deployment directory exists on jarvis
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "mkdir -p /home/jarvis/SharedDrive/bytemap/attandace"

          # Copy production docker-compose.yml to jarvis
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes docker-compose.yml "$VPS_USER@$VPS_HOST:/home/jarvis/SharedDrive/bytemap/attandace/docker-compose.yml"

          # Authenticate to GHCR, pull fresh images, and launch services
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail
             cd /home/jarvis/SharedDrive/bytemap/attandace
             echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin
             export BACKEND_IMAGE='$BACKEND_IMAGE'
             export FRONTEND_IMAGE='$FRONTEND_IMAGE'
             docker compose pull
             docker compose up -d --remove-orphans
             docker logout ghcr.io || true"

          rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
