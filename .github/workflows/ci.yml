
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install ruff pytest
          ruff check .
          pytest

      - name: Check frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run type-check
          npm test -- --run
          NEXT_PUBLIC_API_URL=/api/v1 npm run build

      - name: Build Docker images
        run: |
          docker build -t attendance-backend ./backend
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=/api/v1 \
            -t attendance-frontend ./frontend
