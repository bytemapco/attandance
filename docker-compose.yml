
name: smart-attendance

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD:?Set REDIS_PASSWORD in the root .env file}"

    volumes:
      - redis_data:/data

    networks:
      - internal_net

    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in the root .env file}"

    security_opt:
      - no-new-privileges:true

  backend:
    image: "${BACKEND_IMAGE:-ghcr.io/prathamrajbhar/smart-attendance-backend:latest}"
    restart: unless-stopped

    env_file:
      - path: ./backend/.env
        required: true

    environment:
      ENVIRONMENT: production
      REDIS_URL: "redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in the root .env file}@redis:6379/0"

    ports:
      - "8011:8000"

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - internal_net

    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:8000/health
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

    security_opt:
      - no-new-privileges:true

  frontend:
    image: "${FRONTEND_IMAGE:-ghcr.io/prathamrajbhar/smart-attendance-frontend:latest}"
    restart: unless-stopped

    env_file:
      - path: ./frontend/.env
        required: true

    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"

    ports:
      - "3011:3000"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - internal_net

    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://127.0.0.1:3000/
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

    security_opt:
      - no-new-privileges:true

networks:
  internal_net:
    driver: bridge

volumes:
  redis_data:
    name: smart-attendance-redis-data
