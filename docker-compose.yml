name: smart-attendance

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD}"
    volumes:
      - ./redis:/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    security_opt:
      - no-new-privileges:true

  backend:
    image: "${BACKEND_IMAGE:-ghcr.io/bytemapco/attandance-backend:latest}"
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8000"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
    ports:
      - "8011:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  frontend:
    image: "${FRONTEND_IMAGE:-ghcr.io/bytemapco/attandance-frontend:latest}"
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "3011:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true

networks:
  internal_net:
    driver: bridge
